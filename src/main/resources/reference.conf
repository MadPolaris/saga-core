// saga_v3: participants are never journaled, so the per-participant serializer registry
// (ids 1234/1235) is gone. Cross-node messages (StartSaga, SagaStartReply, TransactionResult,
// StatusSnapshot, GetTransactionStatus replies) are CborSerializable and ride jackson-cbor.
// OperationSucceeded/ManualFixCompleted business-result bytes keep relying on
// allow-java-serialization = on for non-CborSerializable result types (documented tech debt).
// Strict saga: journal/snapshot types are bound to strict-saga (Protobuf). Its wire-crossing
// coordinator commands/replies (StrictSagaCoordinator.Command/Reply) are CborSerializable and
// ride jackson-cbor as well — deployed apps should turn allow-java-serialization off.
akka {
  actor {
    serializers {
      strict-saga = "net.imadz.infra.saga.strict.StrictSagaSerializer"
    }
    serialization-bindings {
      // Strict v1 binds journal events, state snapshots, and the coordinator wire family.
      "net.imadz.infra.saga.strict.StrictDurable" = strict-saga
      "net.imadz.common.CborSerializable" = jackson-cbor
    }
  }
  serialization.jackson {
    // akka 2.6.20 config root (not akka.actor.serialization.jackson). ByteString (not in the
    // 2.6.20 default modules), case-class map keys and the nested sealed traits of the strict
    // wire family (Phase/StrictStatus/Evidence) need explicit shapes.
    jackson-modules += "net.imadz.infra.saga.strict.StrictJacksonModule"
  }
}
